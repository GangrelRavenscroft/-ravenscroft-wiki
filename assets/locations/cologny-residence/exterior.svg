<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Cologny Residence, Geneva</title>
<desc id="d">A discreet historic lake-view villa in Cologny, Geneva, with formal gardens, mature trees, Lake Geneva, and distant Alpine mountains.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ba8c1"/><stop offset=".55" stop-color="#d9d8cc"/><stop offset="1" stop-color="#efd5ab"/></linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9eae"/><stop offset="1" stop-color="#4e6e80"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1d4bd"/><stop offset=".55" stop-color="#c8b99f"/><stop offset="1" stop-color="#ad9b7e"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56606a"/><stop offset="1" stop-color="#303841"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7ccd3" stop-opacity=".85"/><stop offset="1" stop-color="#688492" stop-opacity=".72"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2026" flood-opacity=".28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<path d="M0 286 L120 226 205 250 320 174 430 236 566 156 680 236 816 178 930 236 1045 160 1180 228 1324 170 1450 230 1600 188 1600 360 0 360Z" fill="#8d9696" opacity=".48"/>
<path d="M0 310 L120 272 220 292 340 230 445 285 560 220 685 292 820 230 940 288 1070 220 1190 286 1338 224 1460 280 1600 244 1600 380 0 380Z" fill="#d6d8d1" opacity=".72"/>
<rect y="350" width="1600" height="170" fill="url(#lake)"/>
<path d="M0 395 C260 365 430 425 690 390 C950 355 1190 420 1600 380 L1600 520 0 520Z" fill="#9fb1b7" opacity=".35"/>
<path d="M0 482 C340 465 580 505 860 480 C1135 456 1370 495 1600 470" stroke="#d8e1e4" stroke-width="4" opacity=".5" fill="none"/>
<path d="M0 510 L1600 510 1600 900 0 900Z" fill="#607046"/>
<path d="M0 565 C240 520 410 565 610 535 C820 505 1040 565 1240 530 C1400 502 1510 520 1600 505 L1600 900 0 900Z" fill="#52643d"/>

<!-- mature trees -->
<g opacity=".96">
  <rect x="110" y="405" width="28" height="330" fill="#574836"/>
  <circle cx="120" cy="380" r="118" fill="#334732"/>
  <circle cx="55" cy="430" r="82" fill="#3f5338"/>
  <circle cx="183" cy="432" r="90" fill="#3b5035"/>
  <rect x="1458" y="388" width="30" height="345" fill="#574836"/>
  <circle cx="1475" cy="364" r="124" fill="#344a33"/>
  <circle cx="1405" cy="424" r="86" fill="#3d5237"/>
  <circle cx="1546" cy="424" r="92" fill="#3b5035"/>
</g>

<!-- main villa -->
<g filter="url(#shadow)">
  <rect x="420" y="390" width="760" height="310" rx="4" fill="url(#stone)" stroke="#9d8d73" stroke-width="4"/>
  <rect x="515" y="330" width="570" height="80" fill="url(#stone)" stroke="#9d8d73" stroke-width="4"/>
  <path d="M485 390 L610 285 990 285 1115 390Z" fill="url(#roof)" stroke="#2f363d" stroke-width="5"/>
  <path d="M640 330 L800 220 960 330Z" fill="url(#roof)" stroke="#2f363d" stroke-width="5"/>
  <rect x="775" y="248" width="50" height="82" fill="#b8aa91" stroke="#97876d" stroke-width="3"/>
  <path d="M765 248 L800 212 835 248Z" fill="#45505a"/>
  <rect x="545" y="300" width="34" height="94" fill="#b8aa91"/><path d="M536 300 L562 274 588 300Z" fill="#46515a"/>
  <rect x="1020" y="300" width="34" height="94" fill="#b8aa91"/><path d="M1011 300 L1037 274 1063 300Z" fill="#46515a"/>

  <!-- windows -->
  <g fill="#536c78" stroke="#eee2cc" stroke-width="6">
    <rect x="485" y="445" width="72" height="104"/><rect x="590" y="445" width="72" height="104"/><rect x="938" y="445" width="72" height="104"/><rect x="1043" y="445" width="72" height="104"/>
    <rect x="505" y="585" width="64" height="82"/><rect x="608" y="585" width="64" height="82"/><rect x="928" y="585" width="64" height="82"/><rect x="1031" y="585" width="64" height="82"/>
  </g>
  <!-- central entry -->
  <rect x="700" y="432" width="200" height="268" fill="#cab99d" stroke="#9d8d73" stroke-width="4"/>
  <path d="M720 470 Q800 388 880 470Z" fill="#efe3cf" stroke="#9d8d73" stroke-width="4"/>
  <rect x="750" y="490" width="100" height="210" fill="#536875" stroke="#eee2cc" stroke-width="7"/>
  <line x1="800" y1="490" x2="800" y2="700" stroke="#eee2cc" stroke-width="5"/>
  <line x1="750" y1="565" x2="850" y2="565" stroke="#eee2cc" stroke-width="5"/>
  <!-- restrained modern wing -->
  <rect x="1180" y="505" width="230" height="195" fill="url(#glass)" stroke="#7c8e95" stroke-width="4"/>
  <line x1="1236" y1="505" x2="1236" y2="700" stroke="#dbe5e5" stroke-width="3" opacity=".75"/>
  <line x1="1293" y1="505" x2="1293" y2="700" stroke="#dbe5e5" stroke-width="3" opacity=".75"/>
  <line x1="1350" y1="505" x2="1350" y2="700" stroke="#dbe5e5" stroke-width="3" opacity=".75"/>
</g>

<!-- terrace and gardens -->
<path d="M320 700 L1415 700 1515 900 210 900Z" fill="#d3c8ad"/>
<path d="M392 718 L1335 718 1385 900 340 900Z" fill="#768356"/>
<path d="M760 700 L840 700 900 900 700 900Z" fill="#c9b992"/>
<g fill="#293e2b">
  <ellipse cx="450" cy="760" rx="48" ry="74"/><ellipse cx="560" cy="785" rx="42" ry="66"/><ellipse cx="1150" cy="770" rx="48" ry="74"/><ellipse cx="1260" cy="790" rx="42" ry="66"/>
</g>
<g fill="#8f664c" opacity=".85">
  <circle cx="405" cy="835" r="13"/><circle cx="440" cy="852" r="11"/><circle cx="1200" cy="842" r="13"/><circle cx="1238" cy="824" r="10"/>
</g>
<g fill="#e0d7c7" opacity=".85">
  <ellipse cx="800" cy="820" rx="110" ry="28"/>
  <ellipse cx="800" cy="818" rx="48" ry="15" fill="#6b8994"/>
