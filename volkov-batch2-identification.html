<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Volkov — Batch 2 Identification</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0d1016;color:#f3ead5;font-family:Georgia,"Times New Roman",serif}
header{padding:34px 24px 20px;text-align:center;background:#121722;border-bottom:1px solid #9c7a39}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px);letter-spacing:.04em}
header p{margin:0;color:#c7bfae;font-family:system-ui,-apple-system,sans-serif}
.grid{max-width:1320px;margin:auto;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{position:relative;margin:0;padding:10px;background:#171b22;border:1px solid #b58b3d;box-shadow:0 12px 30px #0008}
.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#222}
.card.wide img{aspect-ratio:auto;object-fit:contain}
.label{position:absolute;top:18px;left:18px;z-index:2;width:58px;height:58px;display:grid;place-items:center;background:#0b0e14e8;border:2px solid #deb75e;color:#fff;font:700 32px/1 system-ui}
figcaption{padding:12px 6px 4px;text-align:center}
figcaption strong{display:block;font-size:20px;margin-bottom:5px}
figcaption span{display:block;color:#c9bea6;font:14px/1.35 system-ui,-apple-system,sans-serif}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr;padding:16px}}
</style>
</head>
