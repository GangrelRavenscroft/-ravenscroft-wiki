<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Volkov — Batch 3 Image Test</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0d0f14;color:#f4f0e6;font-family:Georgia,"Times New Roman",serif}
header{padding:34px 24px 20px;text-align:center;border-bottom:1px solid #8f7336;background:#11141a}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px);font-weight:600;letter-spacing:.04em}
p{margin:0;color:#cfc7b4;font-family:system-ui,-apple-system,sans-serif}
.grid{max-width:1320px;margin:0 auto;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{position:relative;margin:0;background:#171a20;border:1px solid #9a7b3c;padding:10px;box-shadow:0 10px 30px #0008}
.card img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#222}
.card:first-child img{aspect-ratio:4/5}
.card figcaption{text-align:center;padding:12px 4px 4px;font-size:20px;color:#eee4cf}
.num{position:absolute;z-index:2;top:18px;left:18px;width:54px;height:54px;border:2px solid #d5b66a;background:#0b0d12e8;display:grid;place-items:center;font:700 30px/1 system-ui;color:#fff}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr;padding:16px}}
</style>
</head>
<body>
<header>
<h1>House Volkov — Batch 3 Image Test</h1>
<p>Compare images 1–9 here against A–I on the Batch 3 identification collage.</p>
</header>
<main class="grid">

<figure class="card">
  <div class="num">1</div>
  <img src="assets/houses/volkov/crest-full-heraldic.png" alt="Volkov Batch 3 image 1">
  <figcaption>Image 1</figcaption>
</figure>

<figure class="card">
  <div class="num">2</div>
  <img src="assets/houses/volkov/influence-map.png" alt="Volkov Batch 3 image 2">
  <figcaption>Image 2</figcaption>
</figure>

<figure class="card">
  <div class="num">3</div>
  <img src="assets/houses/volkov/restoration-instrument-1953.png" alt="Volkov Batch 3 image 3">
  <figcaption>Image 3</figcaption>
</figure>

<figure class="card">
  <div class="num">4</div>
  <img src="assets/houses/volkov/warsaw-administrative-center.png" alt="Volkov Batch 3 image 4">
  <figcaption>Image 4</figcaption>
</figure>

<figure class="card">
  <div class="num">5</div>
  <img src="assets/houses/volkov/revolution-survival-1917-1921.png" alt="Volkov Batch 3 image 5">
  <figcaption>Image 5</figcaption>
</figure>

<figure class="card">
  <div class="num">6</div>
  <img src="assets/houses/volkov/lviv-borderland-institute.png" alt="Volkov Batch 3 image 6">
  <figcaption>Image 6</figcaption>
</figure>

<figure class="card">
  <div class="num">7</div>
  <img src="assets/locations/brzezina-house/exterior.png" alt="Volkov Batch 3 image 7">
  <figcaption>Image 7</figcaption>
</figure>

<figure class="card">
  <div class="num">8</div>
  <img src="assets/houses/volkov/broken-map-exercise.png" alt="Volkov Batch 3 image 8">
  <figcaption>Image 8</figcaption>
</figure>

<figure class="card">
  <div class="num">9</div>
  <img src="assets/houses/volkov/black-archive.png" alt="Volkov Batch 3 image 9">
  <figcaption>Image 9</figcaption>
</figure>
</main>
</body>
</html>
